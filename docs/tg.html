<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="color-scheme" content="dark">
<title>Portföy</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#0a0d14; --card:#11151f; --line:#1d2330; --txt:#e8ecf4; --mut:#7d8798;
  --up:#3ddc84; --dn:#ff5c6c; --chip:#1a2030;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);
  font:15px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{padding:0 14px calc(28px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
.hero{padding:22px 4px 14px}
.lbl{color:var(--mut);font-size:13px}
.total{font-size:34px;font-weight:700;letter-spacing:-.5px;margin:2px 0 8px;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:6px 12px;border-radius:999px;font-size:14px;font-weight:600;
  font-variant-numeric:tabular-nums;border:1px solid transparent}
.pill.up{color:var(--up);background:rgba(61,220,132,.1);border-color:rgba(61,220,132,.25)}
.pill.dn{color:var(--dn);background:rgba(255,92,108,.1);border-color:rgba(255,92,108,.25)}
.seg{display:flex;gap:4px;background:var(--chip);border-radius:12px;padding:3px;margin:14px 0 6px;width:max-content}
.seg button{border:0;background:transparent;color:var(--mut);font:inherit;font-weight:600;
  padding:7px 16px;border-radius:9px;cursor:pointer}
.seg button.on{background:#27304a;color:var(--txt)}
.sec{display:flex;align-items:center;gap:8px;margin:20px 4px 8px;font-size:17px;font-weight:700}
.badge{background:var(--chip);color:var(--mut);font-size:12px;font-weight:600;padding:2px 8px;border-radius:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 14px;margin-bottom:8px;
  display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-variant-numeric:tabular-nums}
.tk{font-weight:700;font-size:16px}
.tk small{color:var(--mut);font-weight:500;font-size:13px;margin-left:6px}
.val{text-align:right;font-weight:700;font-size:16px}
.sub{color:var(--mut);font-size:13px}
.sub b{font-weight:600}
.r{text-align:right}
.up{color:var(--up)} .dn{color:var(--dn)}
.row{display:flex;justify-content:space-between;align-items:center;background:var(--card);
  border:1px solid var(--line);border-radius:16px;padding:13px 14px;margin-bottom:8px;font-variant-numeric:tabular-nums}
.wl{display:flex;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.wlbox{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.wl:last-child{border-bottom:0}
.foot{color:var(--mut);font-size:12px;text-align:center;margin-top:18px}
.err{background:rgba(255,92,108,.1);border:1px solid rgba(255,92,108,.3);color:var(--dn);
  border-radius:12px;padding:12px;margin-top:16px;font-size:13px}
</style>
</head>
<body>
<div class="hero">
  <div class="lbl">Toplam Varlık</div>
  <div class="total" id="total">–</div>
  <span class="pill" id="pnl">yükleniyor…</span>
  <div class="seg" id="seg">
    <button data-m="day">Günlük</button>
    <button data-m="all" class="on">Toplam</button>
  </div>
</div>

<div class="sec">Hisselerim <span class="badge" id="cnt">0</span></div>
<div id="list"></div>

<div class="row"><span class="lbl">Nakit</span><b id="cash">–</b></div>

<div class="sec">Takip Listesi <span class="badge" id="wcnt">0</span></div>
<div class="wlbox" id="wl"></div>

<div class="foot" id="foot"></div>
<div id="msg"></div>

<script>
(function(){
  // Telegram içinde açıldıysa tam ekran + tema rengi; dışında normal sayfa gibi çalışır
  try{
    var tg=window.Telegram&&window.Telegram.WebApp;
    if(tg){tg.ready();tg.expand();
      try{tg.setHeaderColor("#0a0d14");tg.setBackgroundColor("#0a0d14");}catch(e){}}
  }catch(e){}

  var mode="all", P=null, Q=null;
  var $=function(id){return document.getElementById(id)};
  var usd=function(n){return "$"+n.toLocaleString("tr-TR",{minimumFractionDigits:2,maximumFractionDigits:2})};
  var num=function(n,d){return n.toLocaleString("tr-TR",{minimumFractionDigits:d,maximumFractionDigits:d})};
  var sgn=function(n){return (n>=0?"+":"−")};
  var cls=function(n){return n>=0?"up":"dn"};

  function el(tag,c,t){var e=document.createElement(tag);if(c)e.className=c;if(t!==undefined)e.textContent=t;return e}

  function load(name){
    return fetch("data/"+name+"?t="+Date.now(),{cache:"no-store"}).then(function(r){
      if(!r.ok)throw new Error(name+" "+r.status);return r.json()});
  }

  function render(){
    var pf=P.portfolio||{}, q=(Q&&Q.quotes)||{};
    var rows=[], posVal=0, cost=0, dayPnl=0;
    Object.keys(pf).forEach(function(t){
      var s=+pf[t].shares||0, cb=+pf[t].cost_basis||0;
      if(!s)return;
      var x=q[t]||{}, c=+x.c||0;
      var v=s*c, cs=s*cb, pnl=v-cs, d=s*(+x.d||0);
      posVal+=v; cost+=cs; dayPnl+=d;
      rows.push({t:t,s:s,cb:cb,c:c,v:v,pnl:pnl,pct:cs?pnl/cs*100:0,dp:+x.dp||0,d:d});
    });
    rows.sort(function(a,b){return b.v-a.v});
    var cash=+P.cash||0, total=posVal+cash;

    $("total").textContent=usd(total);
    var pill=$("pnl"), val, pct;
    if(mode==="day"){val=dayPnl;pct=(posVal-dayPnl)?dayPnl/(posVal-dayPnl)*100:0}
    else{val=posVal-cost;pct=cost?(posVal-cost)/cost*100:0}
    pill.className="pill "+cls(val);
    pill.textContent=(val>=0?"▲ ":"▼ ")+sgn(val)+usd(Math.abs(val))+"  (%"+sgn(pct)+num(Math.abs(pct),2)+")";

    $("cnt").textContent=rows.length;
    var list=$("list"); list.textContent="";
    rows.forEach(function(r){
      var card=el("div","card");
      var tk=el("div","tk",r.t); tk.appendChild(el("small","",num(r.s,r.s%1?2:0)+" adet"));
      card.appendChild(tk);
      card.appendChild(el("div","val",usd(r.v)));
      var sub=el("div","sub"); sub.appendChild(document.createTextNode("Maliyet "+usd(r.cb)+" · "));
      var b=el("b",cls(r.dp)+"",usd(r.c)+" ("+sgn(r.dp)+num(Math.abs(r.dp),2)+"%)");
      sub.appendChild(b); card.appendChild(sub);
      var dv=mode==="day"?r.d:r.pnl, dpct=mode==="day"?r.dp:r.pct;
      card.appendChild(el("div","r "+cls(dv),sgn(dv)+usd(Math.abs(dv))+" ("+sgn(dpct)+num(Math.abs(dpct),2)+"%)"));
      list.appendChild(card);
    });

    $("cash").textContent=usd(cash)+(total?"  ·  %"+num(cash/total*100,1):"");

    var wl=P.watchlist||[]; $("wcnt").textContent=wl.length;
    var box=$("wl"); box.textContent="";
    wl.forEach(function(t){
      var x=q[t]||{}, row=el("div","wl");
      row.appendChild(el("b","",t));
      var r=el("span", x.c?cls(+x.dp||0):"sub", x.c?(usd(+x.c)+"  "+sgn(+x.dp||0)+num(Math.abs(+x.dp||0),2)+"%"):"–");
      row.appendChild(r); box.appendChild(row);
    });

    var upd=Q&&Q.updated?new Date(Q.updated):null;
    $("foot").textContent=(Q&&Q.market_open?"Piyasa Açık":"Piyasa Kapalı")+
      (upd?" · Son güncelleme "+upd.toLocaleString("tr-TR",{timeZone:"Europe/Istanbul",hour12:false,
        day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):"")+" · Gecikmeli veri";
  }

  $("seg").addEventListener("click",function(e){
    var m=e.target.getAttribute&&e.target.getAttribute("data-m"); if(!m||!P)return;
    mode=m; [].forEach.call($("seg").children,function(b){b.classList.toggle("on",b.getAttribute("data-m")===m)});
    render();
  });

  Promise.all([load("portfolio.json"),load("quotes.json")]).then(function(r){
    P=r[0];Q=r[1];render();
  }).catch(function(e){
    $("pnl").textContent="veri alınamadı";
    var m=el("div","err","Veri okunamadı: "+e.message); $("msg").appendChild(m);
  });
})();
</script>
</body>
</html>
