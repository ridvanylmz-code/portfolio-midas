name: Portföy İzle - Midas-TR

# Cron saatleri UTC. İstanbul = UTC+3 (yaz/kış farkı yok). BIST: Pzt-Cum 10:00-18:00 (kapanış seansı ~18:10'a kadar).
# Telegram raporları (İstanbul, Pzt-Cum): 09:50 (açılış öncesi) ve 18:20 (kapanış sonrası). Seçim cron metnine göre değil,
#   ABD'deki gibi monitor.py içinde saat penceresine göre yapılır (--auto). Kaçan rapor, saati geçtikten sonraki ilk
#   çalışmada "⏰ Gecikmiş rapor" etiketiyle gider; bir çalışmada en çok bir rapor.
# Sessiz yenileme (dashboard + alarm): 10:07-17:52 arası her 15 dk + 18:05 kapanış sonrası son yenileme.
# Cron satırları yedek tetikleyicidir; asıl zamanlama dışarıdan workflow_dispatch (mode=auto) ile de yapılabilir.
on:
  schedule:
    - cron: "7,22,37,52 7-14 * * 1-5"   # sessiz yenileme
    - cron: "5 15 * * 1-5"              # 18:05 kapanış sonrası yenileme (sessiz)
    - cron: "5 7 * * 1-5"               # 10:05 rapor
    - cron: "0 10 * * 1-5"              # 13:00 rapor
    - cron: "55 14 * * 1-5"             # 17:55 rapor
  workflow_dispatch:
    inputs:
      report:
        description: "Telegram raporu da gönder"
        type: boolean
        default: true
      mode:
        description: "manual: elle çalıştırma (--force) | auto: zamanlanmış çalışma gibi davran (--auto; dış zamanlayıcı için)"
        type: choice
        options:
          - manual
          - auto
        default: manual

permissions:
  contents: write

concurrency:
  group: portfolio-data-bist
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install requests yfinance pandas cryptography

      - name: Fiyatları çek, kaydet, push et (çakışmada en güncel veriyle yeniden dene)
        id: run
        env:
          MARKET: bist
          PORTFOLIO_KEY: ${{ secrets.PORTFOLIO_KEY }}
          TELEGRAM_OUTBOX: ${{ runner.temp }}/outbox.jsonl
          DASHBOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/bist/
          EVENT: ${{ github.event_name }}
          REPORT_INPUT: ${{ inputs.report }}
          MODE: ${{ inputs.mode }}
          BRANCH: ${{ github.ref_name }}
        run: |
          # Rapor/sessiz seçimi monitor.py içinde İstanbul saatine göre (--auto); cron metnine bakılmaz.
          # mode=auto: zamanlanmış çalışma gibi (--auto); manual: elle çalıştırma
          ARGS="--auto"
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$MODE" != "auto" ]; then
            ARGS="--force"
            if [ "$REPORT_INPUT" = "true" ]; then ARGS="$ARGS --report"; fi
          fi
          git config user.name "portfolio-bot"
          git config user.email "portfolio-bot@users.noreply.github.com"
          # Rapor için BIST rejimi / sektörler + bilanço günleri (market-bist-data dalı; yoksa rapor eskisi gibi)
          export MARKET_JSON="$RUNNER_TEMP/market.json"
          git fetch -q --depth=1 origin market-bist-data 2>/dev/null && git show FETCH_HEAD:market-bist.json > "$MARKET_JSON" 2>/dev/null || rm -f "$MARKET_JSON"
          ok=0; rc=0
          for i in 1 2 3 4; do
            git fetch -q origin "$BRANCH" && git reset -q --hard "origin/$BRANCH"
            rm -f "$TELEGRAM_OUTBOX"
            set +e; python scripts/monitor.py $ARGS; rc=$?; set -e
            git add -A bist/state.json docs/bist/data
            # eski kök kopyalar kod tarafından docs/bist/data'ya taşınıp silinir; silinmeleri de commit'e girsin
            for f in bist/portfolio.json bist/history.json; do git add -A "$f" 2>/dev/null || true; done
            if git diff --cached --quiet; then ok=1; echo "Değişiklik yok"; break; fi
            git commit -q -m "data(bist): $(date -u +'%Y-%m-%d %H:%M') UTC"
            if git push -q origin "HEAD:$BRANCH"; then ok=1; break; fi
            echo "push reddedildi (deneme $i)"; sleep $((i * 6))
          done
          echo "ok=$ok" >> "$GITHUB_OUTPUT"; echo "rc=$rc" >> "$GITHUB_OUTPUT"

      - name: Telegram (veri kaydedildikten sonra)
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.BIST_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.BIST_TELEGRAM_CHAT_ID }}
          TELEGRAM_OUTBOX: ${{ runner.temp }}/outbox.jsonl
          PUSH_OK: ${{ steps.run.outputs.ok }}
        run: python scripts/flush_outbox.py

      - name: Sonuç
        if: always()
        env:
          OK: ${{ steps.run.outputs.ok }}
          RC: ${{ steps.run.outputs.rc }}
        run: |
          [ "$OK" = "1" ] || { echo "::error::Veri push edilemedi"; exit 1; }
          [ "$RC" = "0" ] || { echo "::error::monitor.py hata kodu $RC"; exit 1; }
