name: BIST Portföy İzleme

# Cron saatleri UTC. İstanbul = UTC+3 (yaz/kış farkı yok). BIST: Pzt-Cum 10:00-18:00 (kapanış seansı ~18:10'a kadar).
# Telegram raporları (İstanbul): 10:05, 13:00, 17:55 (Pzt-Cum).
# Sessiz yenileme (dashboard + alarm): 10:07-17:52 arası her 15 dk + 18:05 kapanış sonrası son yenileme.
# Not: GitHub zamanlanmış işleri birkaç dk-20 dk geciktirebilir.
on:
  schedule:
    - cron: "7,22,37,52 7-14 * * 1-5"   # sessiz yenileme
    - cron: "5 15 * * 1-5"              # 18:05 kapanış sonrası yenileme (sessiz)
    - cron: "5 7 * * 1-5"               # 10:05 rapor
    - cron: "0 10 * * 1-5"              # 13:00 rapor
    - cron: "55 14 * * 1-5"             # 17:55 rapor
  workflow_dispatch:
    inputs:
      report:
        description: "Telegram raporu da gönder"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: portfolio-data-bist
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests yfinance pandas

      - name: Fiyatları çek / rapor gönder
        env:
          MARKET: bist
          TELEGRAM_BOT_TOKEN: ${{ secrets.BIST_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.BIST_TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/bist/
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          REPORT_INPUT: ${{ inputs.report }}
        run: |
          ARGS=""
          if [ "$EVENT" = "schedule" ]; then
            case "$SCHEDULE" in
              "7,22,37,52 7-14 * * 1-5"|"5 15 * * 1-5") ;;  # sessiz
              *) ARGS="--report" ;;
            esac
          fi
          if [ "$EVENT" = "workflow_dispatch" ]; then
            ARGS="--force"
            if [ "$REPORT_INPUT" = "true" ]; then ARGS="$ARGS --report"; fi
          fi
          python scripts/monitor.py $ARGS

      - name: Veriyi commit'le
        run: |
          git config user.name "portfolio-bot"
          git config user.email "portfolio-bot@users.noreply.github.com"
          git add bist/portfolio.json bist/history.json bist/state.json docs/bist/data
          if git diff --cached --quiet; then echo "Değişiklik yok"; exit 0; fi
          git commit -m "data(bist): $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do
            git pull --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}" && exit 0
            sleep 5
          done
          exit 1
