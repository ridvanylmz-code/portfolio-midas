name: Portföy Defteri

# 4 hesabın günlük kaydı (docs/defter). Veri PORTFOLIO_KEY ile şifreli; Telegram ana bot.
# Otomatik: hafta içi 22:20 UTC (İst. 01:20) Midas-TR / Midas-USD değeri + XU100 / S&P 500 kapanışı.
# Cumartesi 07:10 UTC (İst. 10:10) haftalık özet + Excel Telegram'a gelir.
# Elle: "Run workflow" formu (Info-TR, IBKR değerleri, para giriş/çıkışı, yedek akçe, not, Excel iste).

on:
  schedule:
    - cron: "20 22 * * 1-5"
    - cron: "10 7 * * 6"
  workflow_dispatch:
    inputs:
      islem:
        description: 'İşlem'
        required: true
        type: choice
        default: gun_kaydi
        options:
          - gun_kaydi
          - excel_gonder
          - otomatik_yenile
          - ice_aktar
          - kutu_anahtar
      tarih:
        description: 'Tarih YYYY-AA-GG (boş = bugün)'
        required: false
        type: string
      info_tr:
        description: 'Info-TR toplam varlık ₺ (isteğe bağlı: toplam/hisse, ör. 46260/45943)'
        required: false
        type: string
      ibkr:
        description: 'IBKR hesap değeri $ (nakit dahil)'
        required: false
        type: string
      midas_tr:
        description: 'Midas-TR toplam ₺ (boş = repodan otomatik)'
        required: false
        type: string
      midas_usd:
        description: 'Midas-USD toplam $ (boş = repodan otomatik)'
        required: false
        type: string
      akis:
        description: 'Para giriş(+)/çıkış(−): hesap:tutar; ör. ibkr:+500; info:-2000'
        required: false
        type: string
      yedek:
        description: 'Yedek akçe değiştir: hesap:tutar; ör. midas_tr:90000'
        required: false
        type: string
      not_:
        description: 'Not (hesaba özel: ibkr: metin)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: defter
  cancel-in-progress: false

jobs:
  defter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt openpyxl

      - name: Komutu seç
        id: cmd
        env:
          EVENT: ${{ github.event_name }}
          SCHED: ${{ github.event.schedule }}
          IN_ISLEM: ${{ inputs.islem }}
        run: |
          if [ "$EVENT" = "schedule" ]; then
            if [ "$SCHED" = "10 7 * * 6" ]; then c=excel; else c=oto; fi
          else
            case "$IN_ISLEM" in
              gun_kaydi) c=gir ;; excel_gonder) c=excel ;; otomatik_yenile) c=oto ;;
              ice_aktar) c=ice-aktar ;; kutu_anahtar) c=kutu-anahtar ;; *) c=gir ;;
            esac
          fi
          echo "c=$c" >> "$GITHUB_OUTPUT"

      - name: Defteri güncelle, kaydet, push et
        id: run
        if: steps.cmd.outputs.c != 'excel'
        env:
          CMD: ${{ steps.cmd.outputs.c }}
          PORTFOLIO_KEY: ${{ secrets.PORTFOLIO_KEY }}
          TELEGRAM_OUTBOX: ${{ runner.temp }}/outbox.jsonl
          IN_DATE: ${{ inputs.tarih }}
          IN_INFO_TR: ${{ inputs.info_tr }}
          IN_IBKR: ${{ inputs.ibkr }}
          IN_MIDAS_TR: ${{ inputs.midas_tr }}
          IN_MIDAS_USD: ${{ inputs.midas_usd }}
          IN_FLOWS: ${{ inputs.akis }}
          IN_RESERVE: ${{ inputs.yedek }}
          IN_NOTE: ${{ inputs.not_ }}
          BRANCH: ${{ github.ref_name }}
        run: |
          ARGS=""
          if [ "$CMD" = "oto" ] && [ -n "$IN_DATE" ]; then
            printf '%s' "$IN_DATE" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' || { echo "::error::tarih biçimi"; exit 1; }
            ARGS="--date $IN_DATE"
          fi
          git config user.name "portfolio-bot"
          git config user.email "portfolio-bot@users.noreply.github.com"
          ok=0; rc=0
          for i in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH" && git reset -q --hard "origin/$BRANCH"
            rm -f "$TELEGRAM_OUTBOX"
            set +e; python scripts/defter.py $CMD $ARGS; rc=$?; set -e
            git add -A docs/defter; [ -d defter ] && git add -A defter
            git add -u defter 2>/dev/null || true
            if git diff --cached --quiet; then ok=1; break; fi
            git commit -q -m "defter: $CMD"
            if git push -q origin "HEAD:$BRANCH"; then ok=1; break; fi
            echo "push reddedildi (deneme $i); yeniden uygulanıyor"; sleep $((i * 5))
          done
          echo "ok=$ok" >> "$GITHUB_OUTPUT"; echo "rc=$rc" >> "$GITHUB_OUTPUT"

      - name: Telegram (kayıt push edildikten sonra)
        if: always() && steps.cmd.outputs.c != 'excel'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_OUTBOX: ${{ runner.temp }}/outbox.jsonl
          PUSH_OK: ${{ steps.run.outputs.ok }}
        run: python scripts/flush_outbox.py --on-fail "❌ Defter kaydı GitHub'a yazılamadı. İş akışını tekrar çalıştır."

      - name: Excel + haftalık özet
        if: steps.cmd.outputs.c == 'excel'
        env:
          PORTFOLIO_KEY: ${{ secrets.PORTFOLIO_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "schedule" ]; then python scripts/defter.py excel --summary; else python scripts/defter.py excel; fi

      - name: Sonuç
        if: always() && steps.cmd.outputs.c != 'excel'
        env:
          OK: ${{ steps.run.outputs.ok }}
          RC: ${{ steps.run.outputs.rc }}
        run: |
          [ "$OK" = "1" ] || { echo "::error::Kayıt push edilemedi"; exit 1; }
          [ "$RC" = "0" ] || { echo "::error::İşlem reddedildi (Telegram mesajına bak)"; exit 1; }
