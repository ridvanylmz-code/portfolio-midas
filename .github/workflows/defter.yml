name: Portföy Defteri - Tüm hesaplar

# 4 hesabın günlük kaydı (docs/defter). Veri PORTFOLIO_KEY ile şifreli; Telegram ana bot.
# Otomatik: hafta içi 22:20 UTC (İst. 01:20) Midas-TR / Info-TR / Midas-USD değeri + XU100 / S&P 500 / USD-TRY kapanışı.
# Kayıt yalnız TAMAMLANMIŞ seans gününe yazılır (BIST İst. 18:15, ABD NY 16:15 sonrası); Info-TR değeri trend-bist-data
# dalındaki bars-bist.json'dan tarihli günlük kapanışla hesaplanır (canlı fiyatla değil).
# Cumartesi 07:10 UTC (İst. 10:10) haftalık özet + Excel Telegram'a gelir.
# Elle: "Run workflow" formu (Info-TR, IBKR değerleri, para giriş/çıkışı, yedek akçe, not, Excel iste).

on:
  schedule:
    - cron: "20 22 * * 1-5"
    - cron: "40 4 * * 2-6"       # yedek: 22:20 gecikir/atlanırsa aynı günü tamamlar (idempotent)
    - cron: "10 7 * * 6"
    - cron: "15 6 * * 2-6"       # İst. 09:15: IBKR Flex (rapor kapanıştan sonra hazırlanır)
  workflow_dispatch:
    inputs:
      mode:
        description: "manual: elle çalıştırma | auto: zamanlanmış çalışma gibi davran (dış zamanlayıcı için)"
        type: choice
        options:
          - manual
          - auto
        default: manual
      komut:
        description: 'mode=auto iken çalışacak otomatik komut (zamanlanmış çalışmadaki cron karşılığı): oto = 22:20/04:40 günlük kayıt, ibkr = 06:15 IBKR Flex, excel = Cumartesi haftalık özet + Excel'
        required: false
        type: choice
        default: oto
        options:
          - oto
          - ibkr
          - excel
      islem:
        description: 'İşlem'
        required: true
        type: choice
        default: gun_kaydi
        options:
          - gun_kaydi
          - excel_gonder
          - otomatik_yenile
          - ibkr_cek
          - ice_aktar
          - kutu_anahtar
          - acilis_kaydi
      tarih:
        description: 'Tarih YYYY-AA-GG (boş = bugün)'
        required: false
        type: string
      info_tr:
        description: 'Info-TR toplam varlık ₺ (isteğe bağlı: toplam/hisse, ör. 46260/45943)'
        required: false
        type: string
      ibkr:
        description: 'IBKR hesap değeri $ (nakit dahil)'
        required: false
        type: string
      midas_tr:
        description: 'Midas-TR toplam ₺ (boş = repodan otomatik)'
        required: false
        type: string
      midas_usd:
        description: 'Midas-USD toplam $ (boş = repodan otomatik)'
        required: false
        type: string
      akis:
        description: 'Para giriş(+)/çıkış(−): hesap:tutar; ör. ibkr:+500; info:-2000'
        required: false
        type: string
      yedek:
        description: 'Yedek akçe değiştir: hesap:tutar; ör. midas_tr:90000'
        required: false
        type: string
      not_:
        description: 'Not (hesaba özel: ibkr: metin)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: defter
  cancel-in-progress: false

jobs:
  defter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt openpyxl

      - name: Komutu seç
        id: cmd
        env:
          EVENT: ${{ github.event_name }}
          SCHED: ${{ github.event.schedule }}
          IN_ISLEM: ${{ inputs.islem }}
          MODE: ${{ inputs.mode }}
          KOMUT: ${{ inputs.komut }}
        run: |
          if [ "$EVENT" = "schedule" ]; then
            case "$SCHED" in "10 7 * * 6") c=excel ;; "15 6 * * 2-6") c=ibkr ;; *) c=oto ;; esac
          elif [ "$MODE" = "auto" ]; then
            c="${KOMUT:-oto}"   # zamanlanmış çalışmadaki cron -> komut eşlemesinin karşılığı
          else
            case "$IN_ISLEM" in
              gun_kaydi) c=gir ;; excel_gonder) c=excel ;; otomatik_yenile) c=oto ;;
              ibkr_cek) c=ibkr ;; ice_aktar) c=ice-aktar ;; kutu_anahtar) c=kutu-anahtar ;; acilis_kaydi) c=acilis ;; *) c=gir ;;
            esac
          fi
          echo "c=$c" >> "$GITHUB_OUTPUT"

      - name: BIST günlük mumları (Info-TR tarihli kapanış)
        if: steps.cmd.outputs.c != 'excel'
        run: |
          git fetch -q --depth=1 origin trend-bist-data 2>/dev/null && git show FETCH_HEAD:bars-bist.json > "$RUNNER_TEMP/bars-bist.json" 2>/dev/null \
            || { rm -f "$RUNNER_TEMP/bars-bist.json"; echo "mum dosyası yok; Info-TR yalnız kapalı piyasada canlı fiyatla yazılır"; }

      - name: Defteri güncelle, kaydet, push et
        id: run
        if: steps.cmd.outputs.c != 'excel'
        env:
          CMD: ${{ steps.cmd.outputs.c }}
          BIST_BARS_JSON: ${{ runner.temp }}/bars-bist.json
          PORTFOLIO_KEY: ${{ secrets.PORTFOLIO_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          IBKR_FLEX_TOKEN: ${{ secrets.IBKR_FLEX_TOKEN }}
          IBKR_FLEX_QUERY_ID: ${{ secrets.IBKR_FLEX_QUERY_ID }}
          TELEGRAM_OUTBOX: ${{ runner.temp }}/outbox.jsonl
          IN_DATE: ${{ inputs.tarih }}
          IN_INFO_TR: ${{ inputs.info_tr }}
          IN_IBKR: ${{ inputs.ibkr }}
          IN_MIDAS_TR: ${{ inputs.midas_tr }}
          IN_MIDAS_USD: ${{ inputs.midas_usd }}
          IN_FLOWS: ${{ inputs.akis }}
          IN_RESERVE: ${{ inputs.yedek }}
          IN_NOTE: ${{ inputs.not_ }}
          MODE: ${{ inputs.mode }}
          BRANCH: ${{ github.ref_name }}
        run: |
          # mode=auto: zamanlanmış çalışma gibi; elle giriş alanları yok sayılır
          if [ "$MODE" = "auto" ]; then unset IN_DATE IN_INFO_TR IN_IBKR IN_MIDAS_TR IN_MIDAS_USD IN_FLOWS IN_RESERVE IN_NOTE; fi
          ARGS=""
          if [ "$CMD" = "oto" ] && [ -n "$IN_DATE" ]; then
            printf '%s' "$IN_DATE" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' || { echo "::error::tarih biçimi"; exit 1; }
            ARGS="--date $IN_DATE"
          fi
          git config user.name "portfolio-bot"
          git config user.email "portfolio-bot@users.noreply.github.com"
          ok=0; rc=0
          for i in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH" && git reset -q --hard "origin/$BRANCH"
            rm -f "$TELEGRAM_OUTBOX"
            set +e; python scripts/defter.py $CMD $ARGS; rc=$?; set -e
            git add -A docs/defter; [ -d defter ] && git add -A defter
            git add -u defter 2>/dev/null || true
            if git diff --cached --quiet; then ok=1; break; fi
            git commit -q -m "defter: $CMD"
            if git push -q origin "HEAD:$BRANCH"; then ok=1; break; fi
            echo "push reddedildi (deneme $i); yeniden uygulanıyor"; sleep $((i * 5))
          done
          echo "ok=$ok" >> "$GITHUB_OUTPUT"; echo "rc=$rc" >> "$GITHUB_OUTPUT"

      - name: Telegram (kayıt push edildikten sonra)
        if: always() && steps.cmd.outputs.c != 'excel'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_OUTBOX: ${{ runner.temp }}/outbox.jsonl
          PUSH_OK: ${{ steps.run.outputs.ok }}
        run: python scripts/flush_outbox.py --on-fail "❌ Defter kaydı GitHub'a yazılamadı. İş akışını tekrar çalıştır."

      - name: Excel + haftalık özet
        if: steps.cmd.outputs.c == 'excel'
        env:
          PORTFOLIO_KEY: ${{ secrets.PORTFOLIO_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EVENT: ${{ github.event_name }}
          MODE: ${{ inputs.mode }}
        run: |
          if [ "$EVENT" = "schedule" ] || [ "$MODE" = "auto" ]; then python scripts/defter.py excel --summary; else python scripts/defter.py excel; fi

      - name: Sonuç
        if: always() && steps.cmd.outputs.c != 'excel'
        env:
          OK: ${{ steps.run.outputs.ok }}
          RC: ${{ steps.run.outputs.rc }}
        run: |
          [ "$OK" = "1" ] || { echo "::error::Kayıt push edilemedi"; exit 1; }
          [ "$RC" = "0" ] || { echo "::error::İşlem reddedildi (Telegram mesajına bak)"; exit 1; }
