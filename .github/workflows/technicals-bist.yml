name: Teknik Veri - BIST piyasaları

# Midas-TR mini uygulamasının teknik verisi: docs/bist/data/technicals.json
# (TradingView "turkey" tarayıcısı + Yahoo .IS günlük mumlardan RSI/SMA/MACD/ATR). Anahtar gerekmez.
# Semboller: Midas-TR portföy + takip listesi + trend/bist_tickers.txt (en fazla 40).
# Zamanlama: hafta içi 15:35 UTC (= 18:35 İstanbul, BIST kapanışından sonra); elle de çalışır.
on:
  schedule:
    - cron: "35 15 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: technicals-bist
  cancel-in-progress: false

jobs:
  technicals:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıklar
        run: pip install requests

      - name: tradingview-ta (gayriresmi, başarısız olursa devam)
        continue-on-error: true
        run: pip install tradingview-ta

      - name: Teknik veriyi çek
        env:
          MARKET: bist
        run: python scripts/technicals.py

      - name: Sadece BIST technicals.json'u commit et
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/bist/data/technicals.json
          if git diff --cached --quiet; then echo "Değişiklik yok"; exit 0; fi
          git commit -m "technicals: veri güncellendi"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          echo "push başarısız"; exit 1
