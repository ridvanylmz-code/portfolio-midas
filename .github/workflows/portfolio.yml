name: Portföy Midas - 4 Saatlik Real-time Rapor

on:
  schedule:
    # Istanbul (UTC+3) saatleri
    # 03:01 → 00:01 UTC
    - cron: '1 0 * * *'
    # 07:01 → 04:01 UTC
    - cron: '1 4 * * *'
    # 11:01 → 08:01 UTC
    - cron: '1 8 * * *'
    # 16:16 → 13:16 UTC
    - cron: '16 13 * * *'
    # 16:31 → 13:31 UTC
    - cron: '31 13 * * *'
    # 22:55 → 19:55 UTC
    - cron: '55 19 * * *'
    # 23:01 → 20:01 UTC
    - cron: '1 20 * * *'
  workflow_dispatch:

jobs:
  portfolio-report:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Python Kur
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Dependencies Yükle
      run: |
        pip install requests pandas pytz
    
    - name: Real-time Portföy Raporu Oluştur ve Gönder
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      run: python portfolio_bot_24h.py
