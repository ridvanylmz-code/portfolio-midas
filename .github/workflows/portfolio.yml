name: Portföy Midas - 4 Saatlik Real-time Rapor

on:
  schedule:
    # Her 4 saatte bir (00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC)
    # Istanbul (UTC+3): 03:00, 07:00, 11:00, 15:00, 19:00, 23:00
    - cron: '0 0,4,8,12,16,20 * * *'
  workflow_dispatch:

jobs:
  portfolio-report:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Python Kur
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Dependencies Yükle
      run: |
        pip install requests pandas pytz
    
    - name: Real-time Portföy Raporu Oluştur ve Gönder
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      run: python portfolio_bot_24h.py
