name: Piyasa & Sektör Rotasyonu

# scripts/market.py: rejim (nakit hedefi), sektör/tema ETF göreli güç sıralaması, hisse günlük/haftalık trend.
# Kaynak: TradingView tarayıcısı (tek istek, anahtarsız) -> eksikler Twelve Data günlük -> önceki değer.
# Sonuç 'market-data' dalına market.json olarak yazılır (main geçmişini kirletmez); mini uygulama raw adresinden okur.
# Zamanlama (UTC, hafta içi): ön piyasa, seans boyunca saatte bir, kapanış sonrası. Yaz/kış saatini kapsar.
on:
  schedule:
    - cron: "17 9,12 * * 1-5"        # ön piyasa (ET 05:17/08:17 yazın)
    - cron: "47 13-20 * * 1-5"       # seans içi saatlik
    - cron: "27 21,23 * * 1-5"       # kapanış sonrası
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market
  cancel-in-progress: true

jobs:
  market:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Önceki market.json (yedek için)
        run: |
          mkdir -p market-out
          if git ls-remote --exit-code --heads origin market-data >/dev/null 2>&1; then
            git fetch --depth=1 origin market-data
            git show FETCH_HEAD:market.json > market-out/market.json || rm -f market-out/market.json
          fi

      - name: Hesapla
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: python scripts/market.py --out market-out/market.json

      - name: market-data dalına yaz (tek commit)
        if: always()
        run: |
          [ -f market-out/market.json ] || { echo "market.json yok"; exit 0; }
          cd market-out
          git init -q -b market-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market.json
          git commit -q -m "market: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" market-data:refs/heads/market-data
