name: Portföy Güncelle - Info-TR

# Info Yatırım hesabı: alım/satım, para giriş/çıkışı. Veri defter/info_portfolio.json (PORTFOLIO_KEY ile şifreli).
# Hesap değeri her gece "Portföy Defteri" iş akışında bu pozisyonlardan hesaplanır.

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'İşlem'
        required: true
        type: choice
        options:
          - buy
          - sell
          - deposit
          - withdraw
          - undo
      symbol:
        description: 'Hisse kodu (buy/sell), ör. SASA'
        required: false
        type: string
      quantity:
        description: 'buy/sell: lot · deposit/withdraw: tutar ₺'
        required: false
        type: string
      price:
        description: 'Fiyat ₺ (buy/sell)'
        required: false
        type: string
      commission:
        description: 'Komisyon ₺ (isteğe bağlı)'
        required: false
        type: string
      tarih:
        description: 'İşlem tarihi YYYY-AA-GG (boş = bugün)'
        required: false
        type: string
      confirm:
        description: 'Fiyat son fiyattan %15+ sapıyorsa yine de kaydet'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: defter
  cancel-in-progress: false

jobs:
  info:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: İşlemi uygula, kaydet, push et
        id: run
        env:
          PORTFOLIO_KEY: ${{ secrets.PORTFOLIO_KEY }}
          TELEGRAM_OUTBOX: ${{ runner.temp }}/outbox.jsonl
          IN_ACTION: ${{ inputs.action }}
          IN_SYMBOL: ${{ inputs.symbol }}
          IN_QTY: ${{ inputs.quantity }}
          IN_PRICE: ${{ inputs.price }}
          IN_COMMISSION: ${{ inputs.commission }}
          IN_DATE: ${{ inputs.tarih }}
          IN_CONFIRM: ${{ inputs.confirm }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "portfolio-bot"
          git config user.email "portfolio-bot@users.noreply.github.com"
          ok=0; rc=0
          for i in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH" && git reset -q --hard "origin/$BRANCH"
            rm -f "$TELEGRAM_OUTBOX"
            set +e; python scripts/defter.py info-islem; rc=$?; set -e
            git add defter/info_portfolio.json
            if git diff --cached --quiet; then ok=1; break; fi
            git commit -q -m "info: $IN_ACTION"
            if git push -q origin "HEAD:$BRANCH"; then ok=1; break; fi
            sleep $((i * 5))
          done
          echo "ok=$ok" >> "$GITHUB_OUTPUT"; echo "rc=$rc" >> "$GITHUB_OUTPUT"
      - name: Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_OUTBOX: ${{ runner.temp }}/outbox.jsonl
          PUSH_OK: ${{ steps.run.outputs.ok }}
        run: python scripts/flush_outbox.py --on-fail "❌ Info-TR işlemi kaydedilemedi, tekrar çalıştır."
      - name: Sonuç
        if: always()
        env:
          OK: ${{ steps.run.outputs.ok }}
          RC: ${{ steps.run.outputs.rc }}
        run: |
          [ "$OK" = "1" ] || { echo "::error::push edilemedi"; exit 1; }
          [ "$RC" = "0" ] || { echo "::error::işlem reddedildi (Telegram)"; exit 1; }
