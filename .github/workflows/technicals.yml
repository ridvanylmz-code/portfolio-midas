name: Teknik Veri (deneme)

# DENEME: monitor.yml'den bağımsız. Sadece docs/data/technicals.json yazar.
# Şimdilik: bu dosya push edilince ve elle (workflow_dispatch) çalışır. Zamanlama, test başarılı olunca eklenecek.
on:
  push:
    paths:
      - ".github/workflows/technicals.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: technicals
  cancel-in-progress: false

jobs:
  technicals:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıklar
        run: pip install requests

      - name: tradingview-ta (gayriresmi, başarısız olursa devam)
        continue-on-error: true
        run: pip install tradingview-ta

      - name: Teknik veriyi çek
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: python scripts/technicals.py

      - name: Sadece technicals.json'u commit et
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/technicals.json
          if git diff --cached --quiet; then echo "Değişiklik yok"; exit 0; fi
          git commit -m "technicals: veri güncellendi"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          echo "push başarısız"; exit 1
