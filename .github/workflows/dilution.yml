name: Dilüsyon Taraması - SEC EDGAR

# Takip listesi, pozisyonlar ve market.json picks adayları için SEC EDGAR'dan dilüsyon taraması:
# shelf kayıtları (S-3/F-3), 424B satışları (ATM / hisse / dönüştürülebilir), nakit ve serbest nakit akışı.
# Çıktı: docs/data/dilution.json. Kaynak resmî ve ücretsiz (data.sec.gov); anahtar gerekmez.
# SEC kuralı: User-Agent'ta iletişim bilgisi olmalı → repo secret SEC_USER_AGENT ("Ad Soyad eposta@ornek.com").
# Zamanlama: saat.yml her hafta içi 06:30 ET (13:30/14:30 İstanbul) tetikler; cron yedektir; elle de çalışır.
on:
  schedule:
    - cron: "41 11 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "manual: elle çalıştırma | auto: zamanlayıcıdan"
        type: choice
        options:
          - manual
          - auto
        default: manual

permissions:
  contents: write

concurrency:
  group: dilution
  cancel-in-progress: false

jobs:
  dilution:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Bağımlılıklar
        run: pip install requests

      - name: market.json (picks adayları)
        continue-on-error: true
        run: |
          git fetch --depth 1 origin market-data
          git show FETCH_HEAD:market.json > /tmp/market.json

      - name: EDGAR taraması
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python scripts/dilution.py --market /tmp/market.json

      - name: Sadece dilution.json'u commit et
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/dilution.json
          if git diff --cached --quiet; then echo "Değişiklik yok"; exit 0; fi
          git commit -m "dilüsyon: EDGAR taraması"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          echo "push başarısız"; exit 1
