name: Portföy Güncelle - Midas-TR

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'İşlem türü (batch doluysa yok sayılır)'
        required: false
        type: choice
        options:
          - buy
          - sell
          - deposit
          - withdraw
          - watch_add
          - watch_remove
          - undo
          - zone_below
          - zone_above
          - zone_clear
          - trail_off
          - trail_on
      symbol:
        description: 'Hisse kodu (buy/sell/watch_*/zone_*/trail_* için; deposit/withdraw için boş bırak)'
        required: false
        type: string
      quantity:
        description: 'buy/sell: adet | deposit/withdraw: tutar (₺)'
        required: false
        type: string
      price:
        description: 'Fiyat ₺ (buy/sell) · zone_below: bu fiyata inince alarm · zone_above: bu fiyatı geçince alarm'
        required: false
        type: string
      batch:
        description: "Toplu giriş (doluysa yukarıdaki tekil girdiler yok sayılır; hepsi ya da hiçbiri). Satır sonu ya da ';' ile ayrılır: buy T adet fiyat [komisyon] · sell T adet fiyat [komisyon] · deposit tutar · withdraw tutar · watch_add T · watch_remove T · zone_below T fiyat · zone_above T fiyat · zone_clear T · trail_off T · trail_on T. Ör. buy EMPAE 10 52.3; sell ASELS 5 56"
        required: false
        type: string
      confirm:
        description: 'Fiyat son fiyattan %15+ sapıyorsa yine de kaydet (yazım hatası koruması)'
        required: false
        type: boolean
        default: false
      commission:
        description: 'Komisyon ₺ (isteğe bağlı; buy/sell için, boşsa 0)'
        required: false
        type: string
      date:
        description: 'İşlem tarihi YYYY-AA-GG (TR saati; boşsa bugün). Ör. 2026-10-22'
        required: false
        type: string

permissions:
  contents: write

# Kuyruk/iptal yok: her işlem kendi çalışmasında; aynı anda yazan başka iş olursa en güncel veriyle yeniden uygulanır.

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Pozisyon güncelle, kaydet, push et
        id: run
        env:
          MARKET: bist
          PORTFOLIO_KEY: ${{ secrets.PORTFOLIO_KEY }}
          TELEGRAM_OUTBOX: ${{ runner.temp }}/outbox.jsonl
          IN_ACTION: ${{ inputs.action }}
          IN_TICKER: ${{ inputs.symbol }}
          IN_PRICE: ${{ inputs.price }}
          IN_COMMISSION: ${{ inputs.commission }}
          IN_DATE: ${{ inputs.date }}
          IN_CONFIRM: ${{ inputs.confirm }}
          IN_BATCH: ${{ inputs.batch }}
          QUANTITY: ${{ inputs.quantity }}
          BRANCH: ${{ github.ref_name }}
        run: |
          # deposit/withdraw tutarı --amount'tan, buy/sell adedi --shares'ten okunur
          case "$IN_ACTION" in
            deposit|withdraw) export IN_AMOUNT="$QUANTITY" ;;
            *) export IN_SHARES="$QUANTITY" ;;
          esac
          git config user.name "portfolio-bot"
          git config user.email "portfolio-bot@users.noreply.github.com"
          ok=0; rc=0
          for i in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH" && git reset -q --hard "origin/$BRANCH"
            rm -f "$TELEGRAM_OUTBOX"
            set +e; python scripts/update_position.py; rc=$?; set -e
            [ "$rc" = "0" ] && python scripts/defter.py islemler || true
            git add -A docs/bist/data
            # eski kök kopyalar kod tarafından docs/bist/data'a taşınıp silinir; silinmeleri de commit'e girsin
            for f in bist/portfolio.json bist/history.json; do git add -A "$f" 2>/dev/null || true; done
            git add docs/defter/data
            if git diff --cached --quiet; then ok=1; break; fi
            git commit -q -m "pozisyon(bist): güncellendi"
            if git push -q origin "HEAD:$BRANCH"; then ok=1; break; fi
            echo "push reddedildi (deneme $i); en güncel veriyle yeniden uygulanıyor"; sleep $((i * 5))
          done
          echo "ok=$ok" >> "$GITHUB_OUTPUT"; echo "rc=$rc" >> "$GITHUB_OUTPUT"

      - name: Telegram (yalnızca kayıt push edildikten sonra)
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.BIST_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.BIST_TELEGRAM_CHAT_ID }}
          TELEGRAM_OUTBOX: ${{ runner.temp }}/outbox.jsonl
          PUSH_OK: ${{ steps.run.outputs.ok }}
        run: python scripts/flush_outbox.py --on-fail "❌ İşlem GitHub'a KAYDEDİLEMEDİ, portföy değişmedi. İş akışını tekrar çalıştır."

      - name: Sonuç
        if: always()
        env:
          OK: ${{ steps.run.outputs.ok }}
          RC: ${{ steps.run.outputs.rc }}
        run: |
          [ "$OK" = "1" ] || { echo "::error::Kayıt push edilemedi"; exit 1; }
          [ "$RC" = "0" ] || { echo "::error::İşlem reddedildi (Telegram mesajına bak)"; exit 1; }
