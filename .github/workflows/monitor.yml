name: Portföy İzleme

# Cron saatleri UTC. İstanbul = UTC+3. ABD YAZ saati (kapanış 20:00 UTC = 23:00 İstanbul).
# Telegram raporları (İstanbul): 03:01 (Pzt-Cmt), 07:01, 11:01, 16:16, 16:31, 22:55, 23:01 (Pzt-Cum).
#   - Cumartesi 03:01 haftasonu öncesi son rapor; Pazartesi 03:01 yeni hafta ilk raporu.
#   - Cumartesi 03:01 ile Pazartesi 03:01 arası hiçbir otomatik çalışma yok.
# Sessiz yenileme (dashboard + alarm): hafta içi 13:07-19:52 UTC, her 15 dk (rapor dakikalarıyla çakışmasın diye :07/:22/:37/:52).
# ABD KIŞ saatine geçişte (1 Kasım 2026) tüm rapor saatleri UTC'de +1 saat kaydırılacak.
# Not: GitHub zamanlanmış işleri birkaç dk-20 dk geciktirebilir.
on:
  schedule:
    - cron: "7,22,37,52 13-19 * * 1-5"   # sessiz yenileme
    - cron: "1 0 * * 1-6"                # 03:01 İstanbul (Pzt-Cmt)
    - cron: "1 4 * * 1-5"                # 07:01
    - cron: "1 8 * * 1-5"                # 11:01
    - cron: "16 13 * * 1-5"              # 16:16
    - cron: "31 13 * * 1-5"              # 16:31
    - cron: "55 19 * * 1-5"              # 22:55
    - cron: "1 20 * * 1-5"               # 23:01
  workflow_dispatch:
    inputs:
      report:
        description: "Telegram raporu da gönder"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: portfolio-data
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Fiyatları çek / rapor gönder
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          REPORT_INPUT: ${{ inputs.report }}
        run: |
          ARGS=""
          if [ "$EVENT" = "schedule" ] && [ "$SCHEDULE" != "7,22,37,52 13-19 * * 1-5" ]; then
            ARGS="--report"
          fi
          if [ "$EVENT" = "workflow_dispatch" ]; then
            ARGS="--force"
            if [ "$REPORT_INPUT" = "true" ]; then ARGS="$ARGS --report"; fi
          fi
          python scripts/monitor.py $ARGS

      - name: Veriyi commit'le
        run: |
          git config user.name "portfolio-bot"
          git config user.email "portfolio-bot@users.noreply.github.com"
          git add portfolio.json history.json state.json docs/data
          if git diff --cached --quiet; then echo "Değişiklik yok"; exit 0; fi
          git commit -m "data: $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"

