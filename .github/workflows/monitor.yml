name: Portföy İzle - Midas-USD

# Zamanlama UTC, ama rapor/sessiz seçimi scripts/monitor.py içinde ABD saatine (ET) göre yapılır (--auto):
# yaz/kış saati geçişinde (1 Kasım 2026, Mart 2027) elle değişiklik gerekmez. Her rapor saati için iki cron
# vardır (EDT ve EST karşılığı); saatine denk gelmeyen çalışma sessiz yenilemeye döner.
# Telegram raporları (ET): 22:17 (Paz-Cum), 04:17, 09:27, 09:47, 15:57, 16:17 (Pzt-Cum).
#   İstanbul karşılığı kışın 06:17, 12:17, 17:27, 17:47, 23:57, 00:17; yazın birer saat önce.
# Sessiz yenileme: 30 dk'da bir (:17 / :47), ET 04:17-20:47 (kışın İst. 12:17-04:47); dışı atlanır (monitor.py).
# :17/:47 rapor saatleri sessiz cron'larla zaten kapsanır; :27/:57 ve 22:17 için EDT+EST çift cron var.
# Not: GitHub zamanlanmış işleri birkaç dk-20 dk geciktirebilir; rapor penceresi 25 dk.
on:
  schedule:
    - cron: "17,47 8-23 * * 1-5"         # sessiz yenileme + 04:17, 09:47, 16:17 ET raporları (EDT+EST)
    - cron: "17,47 0,1 * * 2-6"          # kapanış sonrası sonu (ET 20:47'ye kadar)
    - cron: "17 2,3 * * 1-6"             # 22:17 ET raporu (EDT/EST)
    - cron: "27 13,14 * * 1-5"           # 09:27 ET raporu
    - cron: "57 19,20 * * 1-5"           # 15:57 ET raporu
  workflow_dispatch:
    inputs:
      report:
        description: "Telegram raporu da gönder"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: monitor-us          # yalnız izleme çalışmaları sıraya girer; işlem kayıtları (update-position) ayrı
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Fiyatları çek, kaydet, push et (çakışmada en güncel veriyle yeniden dene)
        id: run
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          PORTFOLIO_KEY: ${{ secrets.PORTFOLIO_KEY }}
          DASHBOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          TELEGRAM_OUTBOX: ${{ runner.temp }}/outbox.jsonl
          EVENT: ${{ github.event_name }}
          REPORT_INPUT: ${{ inputs.report }}
          BRANCH: ${{ github.ref_name }}
        run: |
          ARGS="--auto"
          if [ "$EVENT" = "workflow_dispatch" ]; then
            ARGS="--force"
            if [ "$REPORT_INPUT" = "true" ]; then ARGS="$ARGS --report"; fi
          fi
          git config user.name "portfolio-bot"
          git config user.email "portfolio-bot@users.noreply.github.com"
          # Rapor için piyasa rejimi / sektörler (market-data dalı; yoksa rapor eskisi gibi)
          export MARKET_JSON="$RUNNER_TEMP/market.json"
          git fetch -q --depth=1 origin market-data 2>/dev/null && git show FETCH_HEAD:market.json > "$MARKET_JSON" 2>/dev/null || rm -f "$MARKET_JSON"
          ok=0; rc=0
          for i in 1 2 3 4; do
            git fetch -q origin "$BRANCH" && git reset -q --hard "origin/$BRANCH"
            rm -f "$TELEGRAM_OUTBOX"
            set +e; python scripts/monitor.py $ARGS; rc=$?; set -e
            git add portfolio.json history.json state.json docs/data
            if git diff --cached --quiet; then ok=1; echo "Değişiklik yok"; break; fi
            git commit -q -m "data: $(date -u +'%Y-%m-%d %H:%M') UTC"
            if git push -q origin "HEAD:$BRANCH"; then ok=1; break; fi
            echo "push reddedildi (deneme $i); en güncel veriyle yeniden"; sleep $((i * 6))
          done
          echo "ok=$ok" >> "$GITHUB_OUTPUT"; echo "rc=$rc" >> "$GITHUB_OUTPUT"

      - name: Telegram (veri kaydedildikten sonra)
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_OUTBOX: ${{ runner.temp }}/outbox.jsonl
          PUSH_OK: ${{ steps.run.outputs.ok }}
        run: python scripts/flush_outbox.py

      - name: Sonuç
        if: always()
        env:
          OK: ${{ steps.run.outputs.ok }}
          RC: ${{ steps.run.outputs.rc }}
        run: |
          [ "$OK" = "1" ] || { echo "::error::Veri push edilemedi"; exit 1; }
          [ "$RC" = "0" ] || { echo "::error::monitor.py hata kodu $RC"; exit 1; }
