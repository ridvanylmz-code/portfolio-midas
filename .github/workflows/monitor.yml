name: Portföy İzleme

# Saatler UTC. İstanbul = UTC+3.
#  - Her 15 dk (13:00-21:45 UTC, hafta içi): sessiz yenileme -> dashboard verisi + alarm
#  - 07:05 / 13:20 / 17:05 / 21:10 UTC (10:05 / 16:20 / 20:05 / 00:10 İstanbul): Telegram raporu
# Not: GitHub zamanlanmış işleri birkaç dk geciktirebilir. ABD yaz/kış saati farkı
# (kapanış 20:00 / 21:00 UTC) 21:10 raporuyla her iki durumda da kapanış sonrasına denk gelir.
on:
  schedule:
    - cron: "*/15 13-21 * * 1-5"
    - cron: "5 7 * * 1-5"
    - cron: "20 13 * * 1-5"
    - cron: "5 17 * * 1-5"
    - cron: "10 21 * * 1-5"
  workflow_dispatch:
    inputs:
      report:
        description: "Telegram raporu da gönder"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: portfolio-data
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Fiyatları çek / rapor gönder
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          REPORT_INPUT: ${{ inputs.report }}
        run: |
          ARGS=""
          if [ "$EVENT" = "schedule" ] && [ "$SCHEDULE" != "*/15 13-21 * * 1-5" ]; then
            ARGS="--report"
          fi
          if [ "$EVENT" = "workflow_dispatch" ]; then
            ARGS="--force"
            if [ "$REPORT_INPUT" = "true" ]; then ARGS="$ARGS --report"; fi
          fi
          python scripts/monitor.py $ARGS

      - name: Veriyi commit'le
        run: |
          git config user.name "portfolio-bot"
          git config user.email "portfolio-bot@users.noreply.github.com"
          git add portfolio.json history.json state.json docs/data
          if git diff --cached --quiet; then echo "Değişiklik yok"; exit 0; fi
          git commit -m "data: $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"

