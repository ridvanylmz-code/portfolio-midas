name: Trend Tara - USD piyasaları

# Elle tetiklenir: Actions -> "Trend Tara (elle)" -> Run workflow.
# Sembol kutusu doluysa onu, boşsa trend/tickers.txt'yi kullanır. Sonuç `trend-data` dalına trend.json olarak yazılır
# (intraday'in `data` dalına dokunmaz). Sayfa: https://<kullanıcı>.github.io/portfolio-midas/trend/
# Kaynak: Yahoo Finance (anahtarsız); TWELVEDATA_API_KEY varsa eksik kalan semboller için yedek.
on:
  # Otomatik (UTC; Türkiye sabit UTC+3). KIŞ (EST, 1 Kas 2026 - 8 Mar 2027):
  #   İst. 11:17 18:17 20:17 22:17 00:17 = ET 03:17 10:17 12:17 14:17 16:17; ayrıca İst. 03:17 ve 07:17.
  # 8 Mart 2027'de yaz satırına dön: "17 8,14,16,18,20 * * 1-5"
  # Ön/sonrası seans verisi trend.py içinde (Alpaca + extended.py) zaten alınıyor; extended.yml gerekmez.
  # GitHub cron'u 5-35 dk gecikebilir.
  schedule:
    - cron: "17 8,15,17,19,21 * * 1-5"   # KIŞ: ET 03:17 10:17 12:17 14:17 16:17
    - cron: "17 0 * * 2-6"               # İst. 03:17 (seansın ertesi gecesi)
    - cron: "17 4 * * 1-5"               # İst. 07:17
  workflow_dispatch:
    inputs:
      tickers:
        description: "Semboller (virgül/boşluk). Boşsa trend/tickers.txt"
        type: string
        default: ""
      include_portfolio:
        description: "Portföy + izleme listesini de ekle"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: trend
  cancel-in-progress: false

jobs:
  trend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Hesapla
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TICKERS: ${{ github.event.inputs.tickers }}
          INCLUDE_PF: ${{ github.event_name == 'schedule' && 'true' || github.event.inputs.include_portfolio }}
        run: |
          mkdir -p data-out
          ARGS=""
          if [ "$INCLUDE_PF" = "true" ]; then ARGS="--include-portfolio"; fi
          python scripts/trend.py --tickers "$TICKERS" --file trend/tickers.txt --out data-out/trend.json $ARGS

      - name: trend-data dalına yaz (tek commit; intraday'in data dalından bağımsız)
        if: always()
        run: |
          [ -f data-out/trend.json ] || { echo "trend.json yok"; exit 0; }
          cd data-out
          git init -q -b trend-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trend.json
          git commit -q -m "trend: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" trend-data:refs/heads/trend-data

      - name: Sayfa linki
        if: always()
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"; REPO="${GITHUB_REPOSITORY##*/}"
          echo "Trend sayfası: https://${OWNER}.github.io/${REPO}/trend/" >> "$GITHUB_STEP_SUMMARY"
