<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portföy Midas - Real-time Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body { 
      background: var(--surface-0, #f9f8f5); 
      color: var(--text-primary, #0b0b0b);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 20px 16px;
      font-size: 16px;
    }
    
    .container { max-width: 800px; margin: 0 auto; }
    
    .header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 24px;
    }
    
    .title { font-size: 24px; font-weight: 500; }
    
    .status {
      font-size: 12px; color: var(--text-muted, #898781);
      display: flex; align-items: center; gap: 6px;
    }
    
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #0ca30c; animation: pulse 2s infinite;
    }
    
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    
    .summary-grid {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;
      margin-bottom: 24px;
    }
    
    .summary-card {
      background: var(--surface-1, #fcfcfb); 
      border: 0.5px solid var(--border, #e1e0d9);
      border-radius: 8px; padding: 16px;
    }
    
    .summary-label { 
      font-size: 13px; color: var(--text-muted, #898781); margin-bottom: 8px; 
    }
    
    .summary-value { 
      font-size: 20px; font-weight: 500; color: var(--text-primary, #0b0b0b); 
    }
    
    .summary-delta { 
      font-size: 13px; margin-top: 4px; font-weight: 500;
    }
    
    .delta-positive { color: #0ca30c; }
    .delta-negative { color: #d03b3b; }
    
    .chart-section {
      background: var(--surface-1, #fcfcfb); 
      border: 0.5px solid var(--border, #e1e0d9);
      border-radius: 8px; padding: 16px;
      margin-bottom: 24px;
    }
    
    .chart-label { 
      font-size: 13px; color: var(--text-muted, #898781); margin-bottom: 12px; 
    }
    
    #plChart { width: 100%; height: 240px; }
    
    .chart-stats {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 12px;
    }
    
    .stat-item { text-align: center; }
    .stat-label { font-size: 11px; color: var(--text-muted, #898781); margin-bottom: 4px; }
    .stat-value { font-size: 14px; font-weight: 500; }
    
    .portfolio-section {
      margin-bottom: 24px;
    }
    
    .section-title { 
      font-size: 14px; font-weight: 500; 
      color: var(--text-secondary, #52514e);
      margin-bottom: 12px; 
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    
    .portfolio-grid {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;
    }
    
    .stock-card {
      border-radius: 12px; padding: 16px; border: none;
      color: white; position: relative; overflow: hidden;
      cursor: pointer; transition: transform 0.2s;
    }
    
    .stock-card:hover { transform: scale(1.02); }
    
    .stock-card::before {
      content: ""; position: absolute; top: 0; right: 0; 
      width: 80px; height: 80px;
      background: rgba(255,255,255,0.1); border-radius: 50%;
    }
    
    .stock-content { position: relative; z-index: 1; }
    
    .stock-ticker { 
      font-size: 14px; opacity: 0.9; margin-bottom: 8px; font-weight: 500;
    }
    
    .stock-price { 
      font-size: 24px; font-weight: 500; margin-bottom: 8px; 
    }
    
    .stock-change { 
      font-size: 13px; opacity: 0.95; margin-bottom: 8px;
    }
    
    .stock-pl { 
      font-size: 12px; opacity: 0.85; 
    }
    
    .card-positive { 
      background: linear-gradient(135deg, #0ca30c 0%, #087d07 100%); 
    }
    .card-mixed { 
      background: linear-gradient(135deg, #2a78d6 0%, #1e5aa8 100%); 
    }
    .card-negative { 
      background: linear-gradient(135deg, #d03b3b 0%, #a02d2d 100%); 
    }
    
    .watchlist-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
    }
    
    .watch-item {
      background: var(--surface-1, #fcfcfb); 
      border: 0.5px solid var(--border, #e1e0d9);
      border-radius: 8px; padding: 12px; text-align: center;
      cursor: pointer; transition: transform 0.2s;
    }
    
    .watch-item:hover { transform: translateY(-2px); }
    
    .watch-ticker { 
      font-size: 12px; font-weight: 500; margin-bottom: 6px; 
    }
    
    .watch-price { 
      font-size: 14px; margin-bottom: 4px; 
    }
    
    .watch-change { 
      font-size: 11px; font-weight: 500;
    }
    
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.45);
      align-items: center;
      justify-content: center;
      z-index: 999;
    }
    
    .modal.active { display: flex; }
    
    .modal-content {
      background: var(--surface-2, #fcfcfb);
      border-radius: 12px;
      padding: 24px;
      width: 90%;
      max-width: 400px;
      max-height: 80vh;
      overflow-y: auto;
    }
    
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    
    .modal-title { font-size: 20px; font-weight: 500; margin: 0; }
    .modal-close { background: none; border: none; font-size: 20px; cursor: pointer; }
    
    .modal-table {
      width: 100%;
      font-size: 14px;
    }
    
    .modal-table tr {
      border-bottom: 0.5px solid var(--border, #e1e0d9);
    }
    
    .modal-table td {
      padding: 12px 0;
      color: var(--text-secondary, #52514e);
    }
    
    .modal-table td:last-child {
      text-align: right;
      font-weight: 500;
      color: var(--text-primary, #0b0b0b);
    }
    
    .footer {
      font-size: 12px; color: var(--text-muted, #898781); text-align: center;
      padding-top: 16px; border-top: 0.5px solid var(--border, #e1e0d9);
      margin-top: 24px;
    }
    
    .loading {
      text-align: center; padding: 40px 20px;
      color: var(--text-secondary, #52514e);
    }
    
    @media (prefers-color-scheme: dark) {
      body { background: #0b0b0b; color: #f0efec; }
      .summary-card { background: #1a1a19; border-color: #383835; }
      .chart-section { background: #1a1a19; border-color: #383835; }
      .watch-item { background: #1a1a19; border-color: #383835; }
      .modal-content { background: #1a1a19; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="title">📊 Portföy Midas</div>
      <div class="status">
        <span class="status-dot"></span>
        <span id="status-text">Yükleniyor...</span>
      </div>
    </div>
    
    <div id="content">
      <div class="loading">⏳ Real-time veriler yükleniyor...</div>
    </div>
  </div>
  
  <div id="detailModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title" id="modalTitle">Stock Details</h2>
        <button class="modal-close" onclick="closeModal()">×</button>
      </div>
      <table class="modal-table" id="modalTable"></table>
      <button onclick="closeModal()" style="width: 100%; padding: 12px; margin-top: 16px; border: 0.5px solid var(--border, #e1e0d9); border-radius: 6px; background: transparent; cursor: pointer; font-weight: 500; margin-bottom: 0;">Kapat</button>
    </div>
  </div>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
  
  <script>
    const FINNHUB_KEY = 'davdb49r01qp1e4n572gdavdb49r01qp1e4n5730';
    let plChart = null;
    let modalData = {};
    
    async function fetchPortfolioData() {
      try {
        const response = await fetch('https://raw.githubusercontent.com/ridvanylmz-code/portfolio-midas/main/portfolio.json');
        const data = await response.json();
        return data;
      } catch (e) {
        console.error('Portfolio JSON yükleme hatası:', e);
        return null;
      }
    }
    
    async function fetchStockPrice(ticker) {
      try {
        const response = await fetch(
          `https://finnhub.io/api/v1/quote?symbol=${ticker}&token=${FINNHUB_KEY}`
        );
        const data = await response.json();
        if (data.c > 0) {
          return data;
        }
      } catch (e) {
        console.error(`${ticker} fiyat hatası:`, e);
      }
      return null;
    }
    
    function formatCurrency(num) {
      const isNegative = num < 0;
      const absNum = Math.abs(num);
      const formatted = absNum.toLocaleString('en-US', { maximumFractionDigits: 0 });
      return (isNegative ? '-' : '') + formatted;
    }
    
    function showModal(ticker) {
      const data = modalData[ticker];
      if (!data) return;
      
      document.getElementById('modalTitle').textContent = `$${ticker} Details`;
      
      const tableHTML = `
        <tr><td>Current Price</td><td>$${data.price}</td></tr>
        <tr><td>Cost Basis</td><td>$${data.costBasis}</td></tr>
        <tr><td>Shares</td><td>${data.shares}</td></tr>
        <tr><td>Position Value</td><td>$${data.positionValue}</td></tr>
        <tr><td>Cost Value</td><td>$${data.costValue}</td></tr>
        <tr><td>Total P&L</td><td style="color: ${data.pl >= 0 ? '#0ca30c' : '#d03b3b'};">$${data.plValue} (${data.plPct}%)</td></tr>
        <tr><td>Day Change</td><td style="color: ${data.changePct >= 0 ? '#0ca30c' : '#d03b3b'};">${data.changePct > 0 ? '+' : ''}${data.changePct}%</td></tr>
      `;
      
      document.getElementById('modalTable').innerHTML = tableHTML;
      document.getElementById('detailModal').classList.add('active');
    }
    
    function closeModal() {
      document.getElementById('detailModal').classList.remove('active');
    }
    
    async function renderDashboard() {
      const portfolio = await fetchPortfolioData();
      
      if (!portfolio) {
        document.getElementById('content').innerHTML = 
          '<div class="loading">❌ Veriler yüklenemedi</div>';
        return;
      }
      
      const portfolioItems = portfolio.portfolio;
      const watchlist = portfolio.watchlist;
      const cashReserve = portfolio.cash_reserve;
      
      let totalValue = 0;
      let totalCost = 0;
      const stockCards = [];
      const plHistory = [-5240, -5100, -4950, -4800, -4650, -4500, -4923];
      
      // Hisse verilerini çek
      for (const [ticker, data] of Object.entries(portfolioItems)) {
        const price = await fetchStockPrice(ticker);
        
        if (price) {
          const shares = data.shares;
          const costBasis = data.cost_basis;
          const currentPrice = price.c;
          const changePct = price.dp;
          
          const positionValue = currentPrice * shares;
          const costValue = costBasis * shares;
          const pl = positionValue - costValue;
          const plPct = (pl / costValue * 100);
          
          totalValue += positionValue;
          totalCost += costValue;
          
          const changeEmoji = changePct >= 2 ? '📈' : changePct >= 0 ? '📊' : '📉';
          const cardClass = pl > 0 ? 'card-positive' : pl < 0 ? 'card-negative' : 'card-mixed';
          
          stockCards.push({
            ticker,
            price: currentPrice.toFixed(2),
            changePct: changePct.toFixed(2),
            changeEmoji,
            pl: formatCurrency(pl),
            plPct: plPct.toFixed(1),
            cardClass,
            shares,
            costBasis,
            positionValue,
            costValue
          });
          
          modalData[ticker] = {
            price: currentPrice.toFixed(2),
            costBasis: costBasis.toFixed(2),
            shares,
            positionValue: formatCurrency(positionValue),
            costValue: formatCurrency(costValue),
            plValue: formatCurrency(pl),
            plPct: plPct.toFixed(2),
            changePct: changePct.toFixed(2)
          };
        }
      }
      
      const totalPortfolio = totalValue + cashReserve;
      const totalPL = totalValue - totalCost;
      const totalPLPct = (totalPL / totalCost * 100);
      
      const plColorClass = totalPL > 0 ? 'delta-positive' : totalPL < 0 ? 'delta-negative' : '';
      const plDisplay = formatCurrency(totalPL);
      const plPctDisplay = totalPLPct.toFixed(2);
      
      // Watchlist verilereri çek
      const watchlistCards = [];
      for (const ticker of watchlist) {
        const price = await fetchStockPrice(ticker);
        
        if (price) {
          const changePct = price.dp.toFixed(2);
          const changeEmoji = changePct >= 2 ? '📈' : changePct >= 0 ? '📊' : '📉';
          const changeColor = changePct >= 0 ? 'delta-positive' : 'delta-negative';
          
          watchlistCards.push({
            ticker,
            price: price.c.toFixed(2),
            changePct,
            changeEmoji,
            changeColor
          });
          
          modalData[ticker] = {
            price: price.c.toFixed(2),
            costBasis: 'N/A',
            shares: 'N/A',
            positionValue: 'N/A',
            costValue: 'N/A',
            plValue: 'N/A',
            plPct: 'N/A',
            changePct: changePct
          };
        }
      }
      
      // HTML oluştur
      let html = `
        <div class="summary-grid">
          <div class="summary-card">
            <div class="summary-label">Portföy Değeri</div>
            <div class="summary-value">$${formatCurrency(totalValue)}</div>
          </div>
          <div class="summary-card">
            <div class="summary-label">Nakit Yedek</div>
            <div class="summary-value">$${formatCurrency(cashReserve)}</div>
          </div>
          <div class="summary-card">
            <div class="summary-label">Toplam Varlık</div>
            <div class="summary-value">$${formatCurrency(totalPortfolio)}</div>
          </div>
          <div class="summary-card">
            <div class="summary-label">Kar/Zarar</div>
            <div class="summary-value ${plColorClass}">$${plDisplay}</div>
            <div class="summary-delta ${plColorClass}">${plPctDisplay}%</div>
          </div>
        </div>
        
        <div class="chart-section">
          <div class="chart-label">📈 Kar/Zarar Trend (7 Gün)</div>
          <canvas id="plChart" style="width: 100%; height: 200px;"></canvas>
          <div class="chart-stats">
            <div class="stat-item">
              <div class="stat-label">Min</div>
              <div class="stat-value">$${formatCurrency(Math.min(...plHistory))}</div>
            </div>
            <div class="stat-item">
              <div class="stat-label">Orta</div>
              <div class="stat-value">$${formatCurrency(plHistory.reduce((a,b) => a+b)/plHistory.length)}</div>
            </div>
            <div class="stat-item">
              <div class="stat-label">Son</div>
              <div class="stat-value">$${formatCurrency(plHistory[plHistory.length-1])}</div>
            </div>
          </div>
        </div>
        
        <div class="portfolio-section">
          <div class="section-title">🎯 Pozisyonlarım</div>
          <div class="portfolio-grid">
      `;
      
      for (const card of stockCards) {
        html += `
          <div class="stock-card ${card.cardClass}" onclick="showModal('${card.ticker}')">
            <div class="stock-content">
              <div class="stock-ticker">$${card.ticker}</div>
              <div class="stock-price">$${card.price}</div>
              <div class="stock-change">${card.changeEmoji} ${card.changePct > 0 ? '+' : ''}${card.changePct}%</div>
              <div class="stock-pl">P&L: $${card.pl} (${card.plPct > 0 ? '+' : ''}${card.plPct}%)</div>
            </div>
          </div>
        `;
      }
      
      html += `
          </div>
        </div>
        
        <div class="portfolio-section">
          <div class="section-title">👀 Watchlist (${watchlistCards.length})</div>
          <div class="watchlist-grid">
      `;
      
      for (const card of watchlistCards) {
        html += `
          <div class="watch-item" onclick="showModal('${card.ticker}')">
            <div class="watch-ticker">$${card.ticker}</div>
            <div class="watch-price">$${card.price}</div>
            <div class="watch-change ${card.changeColor}">${card.changeEmoji} ${card.changePct > 0 ? '+' : ''}${card.changePct}%</div>
          </div>
        `;
      }
      
      html += `
          </div>
        </div>
        
        <div class="footer">
          ⏰ Son güncelleme: ${new Date().toLocaleTimeString('tr-TR')} Istanbul | 
          🔄 <a href="javascript:location.reload()" style="color: inherit;">Yenile</a>
        </div>
      `;
      
      document.getElementById('content').innerHTML = html;
      document.getElementById('status-text').textContent = 'Çevrimiçi • Son 1 dk';
      
      // Chart oluştur
      const ctx = document.getElementById('plChart');
      if (ctx && !plChart) {
        plChart = new Chart(ctx, {
          type: 'line',
          data: {
            labels: ['1 gün', '2 gün', '3 gün', '4 gün', '5 gün', '6 gün', 'Bugün'],
            datasets: [{
              label: 'P&L',
              data: plHistory,
              borderColor: '#d03b3b',
              backgroundColor: 'rgba(208, 59, 59, 0.1)',
              borderWidth: 2,
              fill: true,
              tension: 0.4,
              pointRadius: 4,
              pointBackgroundColor: '#d03b3b',
              pointBorderColor: 'white'
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              y: { grid: { color: '#e1e0d9' }, beginAtZero: false }
            }
          }
        });
      }
    }
    
    renderDashboard();
    setInterval(renderDashboard, 60000);
  </script>
</body>
</html>
